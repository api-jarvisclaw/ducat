name: Publish to npm

# Tag-driven, matching python-sdk's release flow: `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for npm trusted publishing (OIDC). Harmless while still using a
      # token, so the workflow does not need editing when you switch over.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm install

      - name: Verify before publishing
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: The built CLI runs
        # `npx jarvisclaw` on a cold machine is the entire pitch. Publishing a
        # build whose bin does not execute is the one failure users cannot work
        # around, and it cannot be unpublished after 72 hours.
        run: |
          node dist/cli.js --version
          node dist/cli.js --help | grep -q 'jarvisclaw'

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      - name: Refuse to publish with a git dependency
        # The CLI depends on @jarvisclaw-ai/sdk, which is installed from git until it
        # is on the registry. A git dependency in a published package fails for
        # anyone whose environment has no git, or no access to the repo — so ts-sdk
        # must be published first and this pinned to a version range.
        run: |
          DEP=$(node -p "require('./package.json').dependencies['@jarvisclaw-ai/sdk']")
          case "$DEP" in
            github:*|git+*|git:*)
              echo "::error::@jarvisclaw-ai/sdk is still a git dependency ($DEP). Publish ts-sdk first, then pin a semver range here."
              exit 1
              ;;
          esac
          echo "sdk dependency is $DEP"

      - name: Check the npm credential is AUTHORIZED, not merely present
        # The previous version of this step only tested that the secret was non-empty and
        # printed "npm credential present (40 chars)". A non-empty string is not an
        # authorized one, so the step passed and the publish then failed with
        #
        #   404 Not Found - PUT https://registry.npmjs.org/jarvisclaw
        #
        # npm answers 404 rather than 401 for an unauthorized write to an EXISTING package,
        # so it looks like the package is missing. It is not — `npm owner ls jarvisclaw`
        # succeeds (anonymously, which is why that is no evidence either). The credential was
        # revoked: `npm whoami` answers 401 with this token, and with ts-sdk's copy too, both
        # of which are 40 chars — the legacy token length, and npm has been retiring those.
        #
        # So the check asks the registry. `npm whoami` is the cheapest authenticated call
        # there is and it prints only the account name, never the token.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMSECRET }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::the NPMSECRET repository secret is empty or unset — set it with: gh secret set NPMSECRET --repo api-jarvisclaw/ducat"
            exit 1
          fi
          echo "npm credential present (${#NODE_AUTH_TOKEN} chars) — now asking the registry"
          if ! WHO=$(npm whoami 2>&1); then
            echo "::error::NPMSECRET is present but the registry rejects it: $WHO"
            echo "::error::Publishing would fail as a misleading 404 on PUT. Replace the token:"
            echo "::error::  gh secret set NPMSECRET --repo api-jarvisclaw/ducat"
            exit 1
          fi
          echo "authorized as: $WHO"

      - name: Publish
        # --access public is required, not merely conventional: npm treats a package
        # that does not exist yet as private by default, and --provenance refuses to
        # sign one ("Can't generate provenance for new or private package"). This is
        # an unscoped package, so it was easy to assume the default was already
        # public — it is not, for a first publish.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMSECRET }}

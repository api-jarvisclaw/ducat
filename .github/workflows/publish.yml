name: Publish to npm

# Tag-driven, matching python-sdk's release flow: `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for npm trusted publishing (OIDC). Harmless while still using a
      # token, so the workflow does not need editing when you switch over.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm install

      - name: Verify before publishing
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: The built CLI runs
        # `npx jarvisclaw` on a cold machine is the entire pitch. Publishing a
        # build whose bin does not execute is the one failure users cannot work
        # around, and it cannot be unpublished after 72 hours.
        run: |
          node dist/cli.js --version
          node dist/cli.js --help | grep -q 'jarvisclaw'

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      - name: Refuse to publish with a git dependency
        # The CLI depends on @jarvisclaw/sdk, which is installed from git until it
        # is on the registry. A git dependency in a published package fails for
        # anyone whose environment has no git, or no access to the repo — so ts-sdk
        # must be published first and this pinned to a version range.
        run: |
          DEP=$(node -p "require('./package.json').dependencies['@jarvisclaw/sdk']")
          case "$DEP" in
            github:*|git+*|git:*)
              echo "::error::@jarvisclaw/sdk is still a git dependency ($DEP). Publish ts-sdk first, then pin a semver range here."
              exit 1
              ;;
          esac
          echo "sdk dependency is $DEP"

      - name: Check the npm credential is present
        # An absent secret is an empty string, not an error, so npm publish would
        # fail as a confusing 401/ENEEDAUTH rather than saying what is missing.
        # Only the length is printed — never the value.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMSECRET }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::the NPMSECRET repository secret is empty or unset — set it with: gh secret set NPMSECRET --repo api-jarvisclaw/jarvisclaw-cli"
            exit 1
          fi
          echo "npm credential present (${#NODE_AUTH_TOKEN} chars)"

      - name: Publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMSECRET }}
